<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Grid de cartas</title>
  <desc id="desc">Ejemplo visual de una cuadrícula de cartas de Hearthstone.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="82%">
      <stop offset="0" stop-color="#243a68" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#0e1728" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#050812"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d58b"/>
      <stop offset="0.5" stop-color="#a87931"/>
      <stop offset="1" stop-color="#f9e2a6"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13213a"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="420" height="520" rx="28" fill="url(#bg)"/>
  <rect x="14" y="14" width="392" height="492" rx="24" fill="none" stroke="url(#gold)" stroke-opacity="0.5"/>

  <text x="210" y="55" text-anchor="middle" fill="#f7ecd4" font-family="Georgia, serif" font-size="34" font-weight="800">Grid de cartas</text>
  <text x="210" y="81" text-anchor="middle" fill="#f0cf82" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">3×3</text>

  <g transform="translate(42 104)">
    <rect x="0" y="0" width="74" height="58" rx="12" fill="#10192b" stroke="#c99b4b" stroke-opacity=".45"/>
    <text x="37" y="37" text-anchor="middle" fill="#f7d984" font-family="Georgia, serif" font-size="22" font-weight="800">GRID</text>

    <g transform="translate(84 0)">
      <rect width="78" height="58" rx="12" fill="#15284a" stroke="#c99b4b" stroke-opacity=".38"/>
      <circle cx="39" cy="29" r="19" fill="#a92d2d" stroke="#f2c76b" stroke-width="2"/>
      <text x="39" y="35" text-anchor="middle" fill="#fff3c9" font-family="Georgia" font-size="18" font-weight="800">4+</text>
    </g>
    <g transform="translate(172 0)">
      <rect width="78" height="58" rx="12" fill="#15284a" stroke="#c99b4b" stroke-opacity=".38"/>
      <circle cx="39" cy="29" r="19" fill="#2b6fc6" stroke="#f2c76b" stroke-width="2"/>
      <text x="39" y="35" text-anchor="middle" fill="#fff3c9" font-family="Georgia" font-size="17" font-weight="800">3-4</text>
    </g>
    <g transform="translate(260 0)">
      <rect width="78" height="58" rx="12" fill="#15284a" stroke="#c99b4b" stroke-opacity=".38"/>
      <circle cx="39" cy="29" r="19" fill="#7240bb" stroke="#f2c76b" stroke-width="2"/>
      <text x="39" y="35" text-anchor="middle" fill="#fff3c9" font-family="Georgia" font-size="20" font-weight="800">✦</text>
    </g>

    <g transform="translate(0 68)">
      <rect width="74" height="86" rx="12" fill="#0f2632" stroke="#3eb7d1" stroke-opacity=".35"/>
      <circle cx="37" cy="43" r="22" fill="#d0d6df" stroke="#f2c76b" stroke-width="2"/>
      <text x="37" y="50" text-anchor="middle" fill="#112" font-family="Georgia" font-size="24" font-weight="900">★</text>
    </g>
    <g transform="translate(0 164)">
      <rect width="74" height="86" rx="12" fill="#0f2632" stroke="#3eb7d1" stroke-opacity=".35"/>
      <circle cx="37" cy="43" r="22" fill="#a72f35" stroke="#f2c76b" stroke-width="2"/>
      <text x="37" y="50" text-anchor="middle" fill="#fff3c9" font-family="Georgia" font-size="21" font-weight="900">6+</text>
    </g>
    <g transform="translate(0 260)">
      <rect width="74" height="86" rx="12" fill="#0f2632" stroke="#3eb7d1" stroke-opacity=".35"/>
      <circle cx="37" cy="43" r="22" fill="#2b6fc6" stroke="#f2c76b" stroke-width="2"/>
      <text x="37" y="50" text-anchor="middle" fill="#fff3c9" font-family="Georgia" font-size="18" font-weight="900">0-2</text>
    </g>

    <g fill="url(#cell)" stroke="#2c4065" stroke-width="1.5">
      <rect x="84" y="68" width="78" height="86" rx="12" stroke="#55d782" stroke-opacity=".6"/>
      <rect x="172" y="68" width="78" height="86" rx="12"/>
      <rect x="260" y="68" width="78" height="86" rx="12"/>
      <rect x="84" y="164" width="78" height="86" rx="12"/>
      <rect x="172" y="164" width="78" height="86" rx="12" stroke="#c99b4b" stroke-opacity=".65"/>
      <rect x="260" y="164" width="78" height="86" rx="12"/>
      <rect x="84" y="260" width="78" height="86" rx="12"/>
      <rect x="172" y="260" width="78" height="86" rx="12"/>
      <rect x="260" y="260" width="78" height="86" rx="12"/>
    </g>

    <g filter="url(#glow)">
      <circle cx="123" cy="111" r="18" fill="#1f5cae" stroke="#69a7ff"/>
      <text x="123" y="120" text-anchor="middle" fill="#9fd0ff" font-family="Arial" font-size="30" font-weight="900">+</text>
      <circle cx="211" cy="207" r="18" fill="#1f5cae" stroke="#69a7ff"/>
      <text x="211" y="216" text-anchor="middle" fill="#9fd0ff" font-family="Arial" font-size="30" font-weight="900">+</text>
      <circle cx="299" cy="303" r="18" fill="#1f5cae" stroke="#69a7ff"/>
      <text x="299" y="312" text-anchor="middle" fill="#9fd0ff" font-family="Arial" font-size="30" font-weight="900">+</text>
    </g>

    <g transform="translate(92 76)">
      <rect x="0" y="0" width="62" height="74" rx="8" fill="#14313c" stroke="#75e58a" stroke-opacity=".7"/>
      <rect x="9" y="9" width="44" height="30" rx="8" fill="#55b0e8"/>
      <path d="M12 46h38v18H12z" fill="#c8a87a" opacity=".9"/>
      <text x="31" y="58" text-anchor="middle" fill="#221" font-family="Arial" font-size="7" font-weight="800">Carta</text>
    </g>
  </g>

  <text x="210" y="494" text-anchor="middle" fill="#f0cf82" font-family="Arial" font-size="12" font-weight="700" opacity=".9">Completa las 9 casillas</text>
</svg>
