<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo del minijuego Encuentra el impostor</title>
  <desc id="desc">Vista previa de cartas de Hearthstone en una cuadrícula, con cartas correctas marcadas y una impostora.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17253e"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b89145"/>
      <stop offset="0.18" stop-color="#5f4422"/>
      <stop offset="1" stop-color="#21150b"/>
    </linearGradient>
    <radialGradient id="art1" cx="50%" cy="32%" r="62%">
      <stop offset="0" stop-color="#4de5ff"/>
      <stop offset="0.5" stop-color="#2f7fff"/>
      <stop offset="1" stop-color="#182355"/>
    </radialGradient>
    <radialGradient id="art2" cx="50%" cy="35%" r="62%">
      <stop offset="0" stop-color="#ffcd60"/>
      <stop offset="0.5" stop-color="#b94a30"/>
      <stop offset="1" stop-color="#301230"/>
    </radialGradient>
    <radialGradient id="okGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="rgba(83,255,150,.55)"/>
      <stop offset="1" stop-color="rgba(83,255,150,0)"/>
    </radialGradient>
    <radialGradient id="badGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="rgba(255,83,110,.55)"/>
      <stop offset="1" stop-color="rgba(255,83,110,0)"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="360" height="520" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="324" height="484" rx="22" fill="none" stroke="#d9a441" stroke-opacity=".4"/>
  <text x="180" y="48" text-anchor="middle" fill="#f0cf82" font-size="16" font-weight="900" font-family="Georgia, serif" letter-spacing="2">CATEGORÍA</text>
  <text x="180" y="79" text-anchor="middle" fill="#f7ecd4" font-size="31" font-weight="900" font-family="Georgia, serif">Cartas de Mago</text>
  <text x="180" y="103" text-anchor="middle" fill="#bfc8d7" font-size="13" font-weight="700" font-family="Arial, sans-serif">Encuentra las 5 cartas correctas</text>

  <g transform="translate(37 126)" filter="url(#shadow)">
    <rect width="286" height="260" rx="24" fill="#07101f" stroke="#2f4771" stroke-opacity=".62"/>
    <g transform="translate(21 18)">
      <g transform="translate(0 0)">
        <ellipse cx="43" cy="78" rx="49" ry="80" fill="url(#okGlow)" opacity=".55"/>
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art1)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
        <circle cx="66" cy="8" r="13" fill="#6df2a4" stroke="#15381f" stroke-width="2"/>
        <text x="66" y="13" text-anchor="middle" fill="#102416" font-size="18" font-weight="900">✓</text>
      </g>
      <g transform="translate(86 0)">
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art2)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
      </g>
      <g transform="translate(172 0)">
        <ellipse cx="43" cy="78" rx="49" ry="80" fill="url(#badGlow)" opacity=".44"/>
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art2)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
        <circle cx="66" cy="8" r="13" fill="#ff6b76" stroke="#4b1218" stroke-width="2"/>
        <text x="66" y="13" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">×</text>
      </g>
      <g transform="translate(0 124)">
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art1)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
      </g>
      <g transform="translate(86 124)">
        <ellipse cx="43" cy="78" rx="49" ry="80" fill="url(#okGlow)" opacity=".42"/>
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art1)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
        <circle cx="66" cy="8" r="13" fill="#6df2a4" stroke="#15381f" stroke-width="2"/>
        <text x="66" y="13" text-anchor="middle" fill="#102416" font-size="18" font-weight="900">✓</text>
      </g>
      <g transform="translate(172 124)">
        <rect x="0" y="0" width="70" height="102" rx="10" fill="url(#card)" stroke="#d0a048"/>
        <ellipse cx="35" cy="33" rx="24" ry="28" fill="url(#art1)"/>
        <rect x="10" y="65" width="50" height="22" rx="6" fill="#e6d2a8" opacity=".85"/>
      </g>
    </g>
  </g>

  <g transform="translate(44 418)">
    <rect x="0" y="0" width="272" height="54" rx="18" fill="#10182a" stroke="#d9a441" stroke-opacity=".35"/>
    <text x="136" y="22" text-anchor="middle" fill="#f0cf82" font-size="13" font-family="Arial, sans-serif" font-weight="900">CARTAS ENCONTRADAS</text>
    <text x="136" y="43" text-anchor="middle" fill="#f7ecd4" font-size="24" font-family="Georgia, serif" font-weight="900">2 / 5</text>
  </g>
</svg>
